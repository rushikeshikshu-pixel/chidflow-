services:
  clearinghouse:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["serve-clearing", "--port", "8443"]
    ports:
      - "8443:8443"
    # Required. Compose exits if this is missing or empty. See .env.example.
    environment:
      - "CHIDFLOW_SIGNING_SECRET=${CHIDFLOW_SIGNING_SECRET:?Set CHIDFLOW_SIGNING_SECRET}"
    restart: always

  mcp-proxy:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["serve", "--port", "8080"]
    ports:
      - "8080:8080"
    restart: always
