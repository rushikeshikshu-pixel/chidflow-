name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e . pytest

      - name: Tests
        run: python -m pytest -q

      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Gitleaks (working tree)
        # Scan tracked files as they are now. Older commits still contain
        # placeholder strings; this workflow does not rewrite history.
        run: gitleaks detect --no-git --source . --redact --verbose --config .gitleaks.toml
